name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build tcpflood (Windows)
        working-directory: cmd/tcpflood
        run: GOOS=windows GOARCH=amd64 go build -o ../../tcpflood-windows-amd64.exe .

      - name: Build tcpflood (Linux)
        working-directory: cmd/tcpflood
        run: GOOS=linux GOARCH=amd64 go build -o ../../tcpflood-linux-amd64 .

      - name: Build tcpflood (macOS)
        working-directory: cmd/tcpflood
        run: GOOS=darwin GOARCH=amd64 go build -o ../../tcpflood-darwin-amd64 .

      - name: Build stresstest (Linux)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o stresstest-linux-amd64 .

      - name: Build web frontend
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Rebuild stresstest with frontend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o stresstest-linux-amd64 .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            tcpflood-windows-amd64.exe
            tcpflood-linux-amd64
            tcpflood-darwin-amd64
            stresstest-linux-amd64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
